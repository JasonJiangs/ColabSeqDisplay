# ColabSeqDisplay best-config registry entry.
# Read by colabsd.bestconfig.load_best_config(), and validated by
# colabsd.engine.train_config.load_lora_best_config().

_meta:
  status: tuned
  source: seqdisplay-opt LoRA study, mutation_site_mean pooling, SlugCas9 5NNK library
  source_file: config/lora/best/mutation_site_mean/esmc_300m.yaml
  optuna_trial: 35
  test_spearman_mean: 0.5611
  test_spearman_sd: 0.0107
  n_reevaluation_runs: 9

model: ESMC-300M

parameters:
  adapter_lr: 6.200367363165752e-05
  head_lr: 0.00022817358447343818
  adapter_weight_decay: 0.01
  lora_rank: 32
  lora_alpha: 64
  lora_dropout: 0.2
  effective_batch_size: 16

training:
  tuning_method: lora
  head: mlp
  pooling: mutation_site_mean
  micro_batch_size: 8
  max_epochs: 20
  early_stopping_patience: 3
  max_grad_norm: 1.0
  head_weight_decay: 0.01
  loss: mse
  gradient_accumulation: derive_from_effective_batch_size
  label_preprocessing: train_split_zscore
  evaluate_test_during_optimization: false

evaluation:
  selection_objective: mean_validation_spearman
  split_seeds: [1, 2, 3]
  model_seeds: [11, 22, 33]
